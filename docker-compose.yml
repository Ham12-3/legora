name: legora

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: legora
      POSTGRES_PASSWORD: legora
      POSTGRES_DB: legora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legora -d legora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: legora
      MINIO_ROOT_PASSWORD: legora-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 legora legora-secret &&
      mc mb --ignore-existing local/legora-documents &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+asyncpg://legora:legora@postgres:5432/legora
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: legora
      S3_SECRET_ACCESS_KEY: legora-secret
      S3_BUCKET: legora-documents
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me-at-least-32-bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command: arq app.worker.WorkerSettings --watch app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+asyncpg://legora:legora@postgres:5432/legora
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: legora
      S3_SECRET_ACCESS_KEY: legora-secret
      S3_BUCKET: legora-documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command: pnpm --filter web dev
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Bind mounts from Windows/macOS hosts do not deliver file-change
      # events reliably; poll so edits on the host actually hot-reload.
      WATCHPACK_POLLING: "true"
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-change-me-at-least-32-bytes-long}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me-at-least-32-bytes}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  web_node_modules:
  web_app_node_modules:
